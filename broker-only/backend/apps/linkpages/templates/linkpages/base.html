{% load i18n %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>{% block title %}Only Broker{% endblock %}</title>
<style>
  :root {
    --ground: #F5F6F3; --surface: #FFFFFF; --ink: #15201F; --muted: #5B6866; --line: #DCE2DF;
    --brand: #0E3B43; --brand-ink: #FFFFFF; --ok: #1E7A46; --ok-soft: #E3F3E9; --warn: #9A6200; --warn-soft: #FFF3DC;
    --bad: #B3261E; --bad-soft: #FBE4E2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #0C1413; --surface: #152120; --ink: #E8EFED; --muted: #9AAAA7; --line: #2A3A38;
      --brand: #5FB3BF; --brand-ink: #0C1413; --ok: #6CCB94; --ok-soft: #173326; --warn: #E8B45A; --warn-soft: #33280F;
      --bad: #F08A83; --bad-soft: #3A1C1A; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  .top { background: var(--brand); color: var(--brand-ink); padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px)); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .top b { font-size: 18px; letter-spacing: .2px; }
  .top small { display: block; opacity: .85; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 4px 0 0; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  button, .btn { font: 600 17px system-ui, sans-serif; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; cursor: pointer; width: 100%; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button.primary, .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  button.bad { color: var(--bad); }
  button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .stars label { min-height: 52px; padding: 0 4px; font-size: 16px; gap: 4px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--ground); border: 1px solid var(--line); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .notice { border-radius: 12px; padding: 12px; font-size: 15px; }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  label { font-weight: 600; font-size: 14px; }
  input[type=date], input[type=datetime-local], textarea { font: 16px system-ui, sans-serif; width: 100%; min-height: 48px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .price { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  ul.facts { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  footer { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="top"><b>Only Broker</b>{% if broker %}<small>{% blocktranslate %}Sent by {{ broker }}{% endblocktranslate %}</small>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
<footer>{% translate "This page was opened from a private link sent to you. Please don’t forward it." %}</footer>
</body>
</html>
