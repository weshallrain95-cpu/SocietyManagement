[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "societyos"
version = "0.1.0"
description = "SocietyOS — Governed Society Management Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "SocietyOS Team" }
]

dependencies = []

[project.scripts]
societyos = "society.core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["society*"]

